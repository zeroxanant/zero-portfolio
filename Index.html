<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Anant Login Box</title>
  <link rel="stylesheet" href="login_box.css" />
</head>
<body>
  
 
  <video autoplay muted playsinline class="bg-video" id="bg-video">
    <source src="./bg_video.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <form class="login-card" action="./Homepage.html" method="get">

      <img src="./avatar.png" alt="Profile" class="login-image" />

   

    <h2>Sign in</h2>

    <label for="email">Email or username</label>
    <input id="email" name="email" type="text" placeholder="you@example.com" autocomplete="username" />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" />

    <div class="actions">
      <a class="small-link" href="#">Forgot?</a>
      <button class="btn" type="submit">Login</button>
    </div>

    <div class="foot">Don't have an account? <a href="#" class="small-link">Create</a></div>
  </form>
  
  
  <script>
    const bgVideo = document.getElementById('bg-video');
    bgVideo.addEventListener('ended', () => {
      bgVideo.pause();
    });
     document.querySelector('.login-card').addEventListener('submit', function(e) {
    e.preventDefault();
    // Example check
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value.trim();
    if (email && pass) {
      window.location.href = 'Homepage.html';
    } else {
      alert('Please fill in both fields');
    }
  });
  </script>

</body>
</html>
